# Two ways to run (details in docs/docker.md):
#   A. Neon (shared team database): set DATABASE_URL in .env and just run the jobs below.
#   B. Local database: leave DATABASE_URL blank, set POSTGRES_USER/POSTGRES_PASSWORD, and start it once:
#        docker compose --profile local up -d --wait db
#
#   docker compose run --rm fill         pull data the database doesn't have yet
#   docker compose run --rm update       upsert questions that changed since the last run
#   docker compose run --rm status       what is in the database, what the last runs did
#
# fill, update and status sit behind profiles, so a plain `docker compose up` never starts a job
# (the two jobs share one database lock anyway).
# A dashboard service gets added here later.

x-job: &job
  build: .
  env_file: .env
  # DATABASE_URL (Neon) wins when set. Otherwise the jobs use the optional local `db` service,
  # whose host name inside compose is always `db`, whatever .env says.
  environment:
    POSTGRES_HOST: db
    POSTGRES_USER: ${POSTGRES_USER:-}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    POSTGRES_DB: ${POSTGRES_DB:-stackexchange}
  volumes:
    - ./data:/app/data     # raw API pages, so a run can be replayed without API calls
  restart: "no"

services:
  db:
    image: postgres:16
    profiles: ["local"]      # opt-in: not needed when using Neon
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-stackexchange}
    ports:
      - "${POSTGRES_PORT_ON_HOST:-5432}:5432"   # change if 5432 is taken on your machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-stackexchange}"]
      interval: 5s
      timeout: 5s
      retries: 10

  fill:
    <<: *job
    command: ["python", "fill.py"]
    profiles: ["fill"]

  update:
    <<: *job
    command: ["python", "update.py"]
    profiles: ["update"]

  # Read-only report: cursors, row counts, recent runs, whether a run is active.
  status:
    <<: *job
    command: ["python", "status.py"]
    profiles: ["status"]

volumes:
  pgdata:
